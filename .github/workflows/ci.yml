name: Test and deploy CURB-65

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2,<3' fastapi uvicorn pytest
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q cli.py curb65.py agents enrichment.py simulator.py
      - name: Run Python regression suite
        run: python -m pytest -q

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser syntax
        run: node --check web/app.js
      - name: Run browser calculation tests
        run: node --test tests/browser.test.cjs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and audit application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pydantic>=2,<3' fastapi uvicorn pytest pip-audit
          python -m pip_audit

  container-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build -t curb65-ci .
      - name: Exercise API health endpoint in container
        run: |
          set -euo pipefail
          docker run --detach --rm --name curb65-ci-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env AUDIT_SECRET_KEY="$(openssl rand -hex 32)" curb65-ci
          trap 'docker rm -f curb65-ci-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health -o /tmp/health.json; then
              python -c 'import json; data=json.load(open("/tmp/health.json")); assert data["status"] == "HEALTHY"'
              exit 0
            fi
            sleep 2
          done
          docker logs curb65-ci-smoke
          exit 1

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [python-tests, browser-tests, dependency-audit, container-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed GitHub Pages assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGES_URL%/}"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors "${BASE_URL}/" -o /tmp/curb65-index.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors "${BASE_URL}/app.js" -o /tmp/curb65-app.js
          grep -Fq 'id="score-form"' /tmp/curb65-index.html
          grep -Fq 'function computeScores' /tmp/curb65-app.js
          node --check /tmp/curb65-app.js

